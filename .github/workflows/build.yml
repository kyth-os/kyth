name: Build container image
on:
  schedule:
    - cron: '05 10 * * 0' # 10:05am UTC weekly on Sundays — rebuilds both :latest and :testing with fresh upstream packages
  workflow_dispatch:
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: ["Validation", "CodeQL"]
    types: [completed]
    branches: [main, testing]

permissions:
  contents: read
  actions: read

env:
  IMAGE_DESC: "Kyth — atomic gaming and dev workstation built on Fedora Kinoite"
  IMAGE_KEYWORDS: "bootc,ublue,universal-blue"
  IMAGE_LOGO_URL: "https://avatars.githubusercontent.com/u/120078124?s=200&v=4"  # Put your own image here for a fancy profile on https://artifacthub.io/!
  IMAGE_NAME: "${{ github.event.repository.name }}"  # output image name, usually same as repo name
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  gate:
    name: Gate on Validation + CodeQL
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      ok: ${{ steps.check.outputs.ok }}
      head_sha: ${{ steps.check.outputs.head_sha }}
      head_branch: ${{ steps.check.outputs.head_branch }}
    steps:
      - name: Verify Validation and CodeQL succeeded for SHA
        id: check
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const eventName = context.eventName;
            // schedule / manual dispatch bypass the gate
            if (eventName === 'schedule' || eventName === 'workflow_dispatch') {
              core.setOutput('ok', 'true');
              core.setOutput('head_sha', context.sha);
              core.setOutput('head_branch', context.ref.replace('refs/heads/', ''));
              return;
            }
            if (eventName !== 'workflow_run') {
              core.setOutput('ok', 'false');
              return;
            }
            const run = context.payload.workflow_run;
            // Only branches we care about already filtered by on.branches,
            // but ignore schedule-triggered runs to avoid duplicate scheduled builds
            if (run.event === 'schedule') {
              core.info(`Ignoring schedule-triggered ${run.name} run`);
              core.setOutput('ok', 'false');
              return;
            }
            if (run.conclusion !== 'success') {
              core.info(`${run.name} concluded ${run.conclusion} — gating build`);
              core.setOutput('ok', 'false');
              return;
            }
            const headSha = run.head_sha;
            const headBranch = run.head_branch;
            core.setOutput('head_sha', headSha);
            core.setOutput('head_branch', headBranch);
            // Require both Validation and CodeQL to be successful for this SHA.
            // The build is triggered twice (once per workflow); only the second
            // to complete will see both as success and proceed.
            const required = ['Validation', 'CodeQL'];
            for (const wfName of required) {
              const runs = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: wfName === 'Validation' ? 'validation.yml' : 'codeql.yml',
                head_sha: headSha,
                per_page: 5,
              });
              const ok = runs.data.workflow_runs.some(r => r.conclusion === 'success' && r.head_branch === headBranch);
              if (!ok) {
                core.info(`Waiting for ${wfName} success on ${headSha} (${headBranch}) — not yet`);
                core.setOutput('ok', 'false');
                return;
              }
            }
            core.info(`Both Validation and CodeQL succeeded for ${headSha} — proceeding`);
            core.setOutput('ok', 'true');

  plan:
    name: Plan build matrix
    needs: [gate]
    if: needs.gate.outputs.ok == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      branches: ${{ steps.branches.outputs.branches }}
      head_sha: ${{ needs.gate.outputs.head_sha }}
      head_branch: ${{ needs.gate.outputs.head_branch }}
    steps:
      # Single source of truth for the schedule-builds-both-branches rule,
      # consumed by every job below that matrixes on branch. Previously this
      # expression was copy-pasted into three separate `strategy.matrix`
      # blocks and could drift out of sync.
      - name: Resolve branch matrix
        id: branches
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          HEAD_BRANCH: ${{ needs.gate.outputs.head_branch }}
          HEAD_SHA: ${{ needs.gate.outputs.head_sha }}
        run: |
          exec 3>>"${GITHUB_OUTPUT}"
          if [[ "${EVENT_NAME}" == schedule ]]; then
            echo 'branches=["main","testing"]' >&3
          elif [[ "${EVENT_NAME}" == workflow_run && -n "${HEAD_BRANCH}" ]]; then
            # Gated via Validation/CodeQL — build the exact branch that was validated
            # (workflow_run's head_branch, not the default branch)
            echo "branches=[\"${HEAD_BRANCH}\"]" >&3
            echo "head_sha=${HEAD_SHA}" >&3 || true
          else
            echo "branches=[\"${REF_NAME}\"]" >&3
          fi

  build_push:
    name: Build and push (${{ matrix.branch }}, ${{ matrix.kernel_flavor }})
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # fail-fast is false below, so a cachy failure never blocks the fedora leg
    # or the live ISO dispatch. Let it mark the run red — continue-on-error here
    # would hide scheduled cachy build breakage indefinitely.
    env:
      DOCKER_CONFIG: /tmp/kyth-docker-config

    # One slot per branch — prevents a scheduled run and a push from racing on the same tag.
    concurrency:
      group: ${{ github.workflow }}-${{ matrix.branch }}-${{ matrix.kernel_flavor }}
      cancel-in-progress: ${{ github.event_name != 'schedule' }}

    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJSON(needs.plan.outputs.branches) }}
        kernel_flavor: [fedora, cachy]

    permissions:
      contents: read
      packages: write

    steps:
      - name: Prepare environment
        id: prep
        env:
          MATRIX_BRANCH: ${{ matrix.branch }}
        run: | # zizmor: ignore[github-env]
          exec 3>>"${GITHUB_OUTPUT}"
          exec 4>>"${GITHUB_ENV}"
          [[ "${MATRIX_BRANCH}" == main || "${MATRIX_BRANCH}" == testing ]]
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >&4
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >&4
          DATE_SHORT="$(date -u +%Y%m%d)"
          echo "date_short=${DATE_SHORT}" >&3

      # These stage versions are pinned by https://github.com/renovatebot/renovate
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # For gated workflow_run, check out the exact SHA that Validation/CodeQL
          # approved; otherwise fall back to the branch tip (schedule/dispatch)
          ref: ${{ needs.plan.outputs.head_sha || matrix.branch }}
          persist-credentials: false

      # Local composite actions resolve from the checked-out working tree, so
      # this must run after Checkout — unlike the old inline run: step it
      # replaced, which needed no repo files and could run before it.
      - name: Resolve default tag
        id: resolve_tag
        uses: ./.github/actions/resolve-image-tag
        with:
          branch: ${{ matrix.branch }}
          kernel-flavor: ${{ matrix.kernel_flavor }}

      - name: Capture checked-out commit
        id: checkout_sha
        run: |
          exec 3>>"${GITHUB_OUTPUT}"
          SHA="$(git rev-parse HEAD)"
          echo "sha=${SHA}" >&3
          echo "short_sha=${SHA:0:8}" >&3
          echo "image_version=${STEPS_PREP_OUTPUTS_DEFAULT_TAG}.${STEPS_PREP_OUTPUTS_DATE_SHORT}.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}.${SHA:0:8}" >&3
        env:
          STEPS_PREP_OUTPUTS_DEFAULT_TAG: ${{ steps.resolve_tag.outputs.tag }}
          STEPS_PREP_OUTPUTS_DATE_SHORT: ${{ steps.prep.outputs.date_short }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Maximize build space
        uses: ./.github/actions/free-disk-space

      - name: Prepare Docker auth config
        run: |
          mkdir -p "${DOCKER_CONFIG}"
          printf '{"auths":{}}\n' > "${DOCKER_CONFIG}/config.json"

      - name: Get current date
        id: date
        run: |
          # This generates a timestamp like what is defined on the ArtifactHub documentation
          # E.G: 2022-02-08T15:38:15Z'
          # https://artifacthub.io/docs/topics/repositories/container-images/
          # https://linux.die.net/man/1/date
          exec 3>>"${GITHUB_OUTPUT}"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >&3

      # Image metadata for https://artifacthub.io/ - This is optional but is highly recommended so we all can get a index of all the custom images
      # The metadata by itself is not going to do anything, you choose if you want your image to be on ArtifactHub or not.
      - name: Image Metadata
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        id: metadata
        with:
          # This generates all the tags for your image, you can add custom tags here too!
          # Default tags are "$DEFAULT_TAG" and "$DEFAULT_TAG.$date".
          tags: |
            type=raw,value=${{ steps.resolve_tag.outputs.tag }}
            type=raw,value=${{ steps.checkout_sha.outputs.image_version }}
            type=raw,value=${{ steps.prep.outputs.date_short }}.${{ github.run_number }}.${{ github.run_attempt }}.${{ steps.checkout_sha.outputs.short_sha }},enable=${{ matrix.branch == 'main' && matrix.kernel_flavor == 'fedora' }}
          labels: |
            io.artifacthub.package.readme-url=https://raw.githubusercontent.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/${{ steps.checkout_sha.outputs.sha }}/README.md
            org.opencontainers.image.created=${{ steps.date.outputs.date }}
            org.opencontainers.image.description=${{ env.IMAGE_DESC }}
            org.opencontainers.image.documentation=https://raw.githubusercontent.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/${{ steps.checkout_sha.outputs.sha }}/README.md
            org.opencontainers.image.source=https://github.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/blob/${{ steps.checkout_sha.outputs.sha }}/Dockerfile
            org.opencontainers.image.revision=${{ steps.checkout_sha.outputs.sha }}
            org.opencontainers.image.title=${{ env.IMAGE_NAME }}
            org.opencontainers.image.url=https://github.com/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}/tree/${{ steps.checkout_sha.outputs.sha }}
            org.opencontainers.image.vendor=${{ github.repository_owner }}
            org.opencontainers.image.version=${{ steps.checkout_sha.outputs.image_version }}
            io.artifacthub.package.deprecated=false
            io.artifacthub.package.keywords=${{ env.IMAGE_KEYWORDS }}
            io.artifacthub.package.license=Apache-2.0
            io.artifacthub.package.logo-url=${{ env.IMAGE_LOGO_URL }}
            io.artifacthub.package.prerelease=${{ matrix.branch != 'main' }}
            containers.bootc=1
          sep-tags: " "
          sep-labels: "\n"
          sep-annotations: "\n"

      - name: Login to GitHub Container Registry
        uses: ./.github/actions/registry-login
        with:
          password: ${{ secrets.GITHUB_TOKEN }}

      # Version resolution lives in build_files/scripts/resolve-versions.py,
      # shared with the Justfile so the parsing logic exists in one place.
      - name: Resolve latest CachyOS kernel version
        id: cachyos_kernel
        if: matrix.kernel_flavor == 'cachy'
        uses: ./.github/actions/resolve-versions
        with:
          dependency: cachyos-kernel

      - name: Resolve latest Proton-CachyOS version
        id: proton_cachyos
        uses: ./.github/actions/resolve-versions
        with:
          dependency: proton-cachyos

      - name: Resolve thirdparty tool versions
        id: thirdparty_versions
        uses: ./.github/actions/resolve-versions
        with:
          dependency: thirdparty-versions

      - name: Resolve upstream base image digest
        id: upstream_base
        run: |
          exec 3>>"${GITHUB_OUTPUT}"
          IMAGE="ghcr.io/ublue-os/kinoite-main:44"
          DIGEST="$(docker buildx imagetools inspect "${IMAGE}" --format '{{ .Manifest.Digest }}')"
          build_files/scripts/validate-digest.sh "${DIGEST}"
          echo "image=${IMAGE}" >&3
          echo "digest=${DIGEST}" >&3
          echo "pinned=${IMAGE}@${DIGEST}" >&3

      - name: Build base image
        id: build_base
        run: |
          exec 3>>"${GITHUB_OUTPUT}"
          IMAGE_FULL="ghcr.io/${{ github.repository_owner }}/${IMAGE_NAME}"
          BASE_CACHE_REF="${IMAGE_FULL}:buildcache-base-${MATRIX_BRANCH}-${MATRIX_KERNEL_FLAVOR}"
          BASE_IMAGE_REF="${IMAGE_FULL}:base-${STEPS_PREP_OUTPUTS_DEFAULT_TAG}"

          docker buildx build \
            --build-arg BASE_IMAGE="${STEPS_UPSTREAM_BASE_OUTPUTS_PINNED}" \
            --build-arg KYTH_KERNEL_FLAVOR="${MATRIX_KERNEL_FLAVOR}" \
            --build-arg CACHYOS_KERNEL_VER="${CACHYOS_KERNEL_VERSION}" \
            --cache-from "type=gha,scope=base-${MATRIX_BRANCH}-${MATRIX_KERNEL_FLAVOR}" \
            --cache-from "type=registry,ref=${BASE_CACHE_REF}" \
            --cache-to "type=gha,scope=base-${MATRIX_BRANCH}-${MATRIX_KERNEL_FLAVOR},mode=max" \
            --cache-to "type=registry,ref=${BASE_CACHE_REF},mode=max" \
            --tag "${BASE_IMAGE_REF}" \
            --metadata-file "${RUNNER_TEMP}/base-build-metadata.json" \
            --push \
            build_base/

          BASE_DIGEST="$(jq -r '."containerimage.digest"' "${RUNNER_TEMP}/base-build-metadata.json")"
          build_files/scripts/validate-digest.sh "${BASE_DIGEST}"
          echo "image=${BASE_IMAGE_REF}" >&3
          echo "digest=${BASE_DIGEST}" >&3
          echo "pinned=${BASE_IMAGE_REF}@${BASE_DIGEST}" >&3
        env:
          MATRIX_BRANCH: ${{ matrix.branch }}
          MATRIX_KERNEL_FLAVOR: ${{ matrix.kernel_flavor }}
          CACHYOS_KERNEL_VERSION: ${{ steps.cachyos_kernel.outputs.version || 'unused' }}
          STEPS_PREP_OUTPUTS_DEFAULT_TAG: ${{ steps.resolve_tag.outputs.tag }}
          STEPS_UPSTREAM_BASE_OUTPUTS_PINNED: ${{ steps.upstream_base.outputs.pinned }}

      # Single source of truth for the org.kyth.build.* / base.* provenance
      # labels — both the buildx build below and the rechunk step further
      # down need this exact set, and previously typed it out twice.
      - name: Compose build-provenance labels
        id: build_labels
        env:
          BASE_IMAGE: ${{ steps.build_base.outputs.image }}
          BASE_DIGEST: ${{ steps.build_base.outputs.digest }}
          UPSTREAM_BASE: ${{ steps.upstream_base.outputs.pinned }}
          PROTON_CACHYOS_VERSION: ${{ steps.proton_cachyos.outputs.version }}
          THIRDPARTY_VERSIONS_HASH: ${{ steps.thirdparty_versions.outputs.hash }}
          UMU_VERSION: ${{ steps.thirdparty_versions.outputs.version }}
          KERNEL_FLAVOR: ${{ matrix.kernel_flavor }}
          CACHYOS_KERNEL_VERSION: ${{ steps.cachyos_kernel.outputs.version || 'unused' }}
        run: |
          {
            echo "labels<<KYTH_BUILD_LABELS_EOF"
            echo "org.opencontainers.image.base.name=${BASE_IMAGE}"
            echo "org.opencontainers.image.base.digest=${BASE_DIGEST}"
            echo "org.kyth.build.upstream-base=${UPSTREAM_BASE}"
            echo "org.kyth.build.proton-cachyos-version=${PROTON_CACHYOS_VERSION}"
            echo "org.kyth.build.thirdparty-versions-hash=${THIRDPARTY_VERSIONS_HASH}"
            echo "org.kyth.build.umu-version=${UMU_VERSION}"
            echo "org.kyth.build.kernel-flavor=${KERNEL_FLAVOR}"
            echo "org.kyth.build.cachyos-kernel-version=${CACHYOS_KERNEL_VERSION}"
            echo "KYTH_BUILD_LABELS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build final image
        id: build_final
        run: |
          exec 3>>"${GITHUB_OUTPUT}"
          IMAGE_FULL="ghcr.io/${{ github.repository_owner }}/${IMAGE_NAME}"
          FINAL_CACHE_REF="${IMAGE_FULL}:buildcache-final-${MATRIX_BRANCH}-${MATRIX_KERNEL_FLAVOR}"
          RAW_IMAGE_REF="${IMAGE_FULL}:build-input-${STEPS_PREP_OUTPUTS_DEFAULT_TAG}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          LABEL_ARGS=()
          while IFS= read -r label; do
            [[ -n "${label}" ]] && LABEL_ARGS+=(--label "${label}")
          done < <(printf '%s\n%s\n' "${STEPS_METADATA_OUTPUTS_LABELS}" "${STEPS_BUILD_LABELS_OUTPUTS_LABELS}")

          # MOK_KEY is optional — builds without it, or with a stale key, skip
          # vmlinuz signing gracefully for the regular container image.
          # To enable Secure Boot: add MOK_KEY as a repository secret containing
          # the PEM-encoded RSA private key matching build_files/secureboot/kyth-secureboot.cer.
          MOK_SECRET_ARG=()
          SECUREBOOT_SIGNING_REQUESTED=0
          if [[ -n "${MOK_KEY:-}" ]]; then
            MOK_SECRET_ARG=(--secret "id=mok_key,env=MOK_KEY")
            # Strict mode: with a key configured, a mismatched/unreadable key
            # must fail the build instead of silently shipping unsigned vmlinuz.
            SECUREBOOT_SIGNING_REQUESTED=1
          fi

          docker buildx build \
            --secret id=github_token,env=GITHUB_TOKEN \
            "${MOK_SECRET_ARG[@]}" \
            --build-arg BASE_IMAGE="${STEPS_BUILD_BASE_OUTPUTS_PINNED}" \
            --build-arg PROTON_CACHYOS_VER="${STEPS_PROTON_CACHYOS_OUTPUTS_VERSION}" \
            --build-arg UMU_VERSION="${STEPS_THIRDPARTY_VERSIONS_OUTPUTS_UMU}" \
            --build-arg THIRDPARTY_VERSIONS_HASH="${STEPS_THIRDPARTY_VERSIONS_OUTPUTS_HASH}" \
            --build-arg ENABLE_GAMING_PERIPHERALS=0 \
            --build-arg ENABLE_VIRTUALIZATION_HOST=0 \
            --build-arg ENABLE_KSM=0 \
            --build-arg BUILD_DATE="$(date +%Y-%m-%d)" \
            --build-arg SECUREBOOT_SIGNING_REQUESTED="${SECUREBOOT_SIGNING_REQUESTED}" \
            --cache-from "type=gha,scope=final-${MATRIX_BRANCH}-${MATRIX_KERNEL_FLAVOR}" \
            --cache-from "type=registry,ref=${FINAL_CACHE_REF}" \
            --cache-to "type=gha,scope=final-${MATRIX_BRANCH}-${MATRIX_KERNEL_FLAVOR},mode=max" \
            --cache-to "type=registry,ref=${FINAL_CACHE_REF},mode=max" \
            --tag "${RAW_IMAGE_REF}" \
            "${LABEL_ARGS[@]}" \
            --metadata-file "${RUNNER_TEMP}/final-build-metadata.json" \
            --push \
            .

          DIGEST="$(jq -r '."containerimage.digest"' "${RUNNER_TEMP}/final-build-metadata.json")"
          build_files/scripts/validate-digest.sh "${DIGEST}"
          REVISION="$(docker buildx imagetools inspect "${RAW_IMAGE_REF}@${DIGEST}" --format '{{ index .Image.Config.Labels "org.opencontainers.image.revision" }}')"
          test "${REVISION}" = "${STEPS_CHECKOUT_SHA_OUTPUTS_SHA}"
          echo "image=${IMAGE_FULL}" >&3
          # legacy-rechunk derives its OCI output directory from this value and
          # cannot safely handle digest-qualified references containing @sha256.
          # The run-unique tag prevents another build from moving this input.
          echo "raw_ref=${RAW_IMAGE_REF}" >&3
          echo "digest=${DIGEST}" >&3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Repository-only secret on trusted push/schedule builds; an environment
          # would add release approval gates to every image build.
          MOK_KEY: ${{ secrets.MOK_KEY }} # zizmor: ignore[secrets-outside-env]
          MATRIX_BRANCH: ${{ matrix.branch }}
          MATRIX_KERNEL_FLAVOR: ${{ matrix.kernel_flavor }}
          STEPS_PREP_OUTPUTS_DEFAULT_TAG: ${{ steps.resolve_tag.outputs.tag }}
          STEPS_METADATA_OUTPUTS_LABELS: ${{ steps.metadata.outputs.labels }}
          STEPS_BUILD_LABELS_OUTPUTS_LABELS: ${{ steps.build_labels.outputs.labels }}
          STEPS_PROTON_CACHYOS_OUTPUTS_VERSION: ${{ steps.proton_cachyos.outputs.version }}
          STEPS_THIRDPARTY_VERSIONS_OUTPUTS_HASH: ${{ steps.thirdparty_versions.outputs.hash }}
          STEPS_THIRDPARTY_VERSIONS_OUTPUTS_UMU: ${{ steps.thirdparty_versions.outputs.version }}
          STEPS_BUILD_BASE_OUTPUTS_PINNED: ${{ steps.build_base.outputs.pinned }}
          STEPS_CHECKOUT_SHA_OUTPUTS_SHA: ${{ steps.checkout_sha.outputs.sha }}

      - name: Login rootful Podman to GHCR
        uses: ./.github/actions/registry-login
        with:
          password: ${{ secrets.GITHUB_TOKEN }}
          docker: "false"
          sudo-podman: "true"

      - name: Free disk space before rechunking (conditional)
        run: |
          USED_PCT="$(df --output=pcent / | tail -1 | tr -d ' %')"
          if [ "${USED_PCT:-0}" -gt 80 ]; then
            echo "::notice::Disk ${USED_PCT}% used on /, pruning buildx cache"
            docker buildx prune -f
            docker system prune -f
          else
            echo "::notice::Disk ${USED_PCT}% used on /, skipping prune (already freed via free-disk-space)"
          fi

      # Default graphroot (on /) and runroot (tmpfs under /run) are both too
      # small for the rechunk mount; cachy hit the same ENOSPC-driven
      # `crun: unknown version specified` failure fedora was moved off of
      # in 7e31fbd, so this now runs for every kernel flavor.
      - name: Relocate containers storage for rechunk
        run: |
          sudo mkdir -p /mnt/containers-storage /mnt/containers-runroot
          sudo tee /etc/containers/storage.conf >/dev/null <<'EOF'
          [storage]
          driver = "overlay"
          graphroot = "/mnt/containers-storage"
          runroot = "/mnt/containers-runroot"
          EOF
          sudo podman system prune --all --force || true
          df -h / /mnt

      - name: Rechunk final image
        id: rechunk
        uses: mrtrick37/legacy-rechunk@f95692cb132163cddcf50d6ed024e888ec2ce81a # kyth-clean
        with:
          rechunk: ghcr.io/mrtrick37/legacy-rechunk@sha256:ed2e0c0749cae465284b14c61c2106d7d929d5f270b838f27a251d31fcacf800
          ref: ${{ steps.build_final.outputs.raw_ref }}
          prev-ref: ${{ steps.build_final.outputs.image }}:${{ steps.resolve_tag.outputs.tag }}
          meta: build_files/rechunk-meta.json
          max-layers: '64'
          skip_compression: true
          version: ${{ steps.checkout_sha.outputs.image_version }}
          revision: ${{ steps.checkout_sha.outputs.sha }}
          description: ${{ env.IMAGE_DESC }}
          labels: |
            ${{ steps.metadata.outputs.labels }}
            ${{ steps.build_labels.outputs.labels }}

      - name: Validate rechunked candidate
        env:
          SOURCE_REF: ${{ steps.rechunk.outputs.ref }}
          EXPECTED_VERSION: ${{ steps.checkout_sha.outputs.image_version }}
          EXPECTED_REVISION: ${{ steps.checkout_sha.outputs.sha }}
        run: |
          set -euo pipefail
          IMAGE_ID="$(sudo podman pull "${SOURCE_REF}")"
          LAYERS="$(sudo podman image inspect --format '{{ len .RootFS.Layers }}' "${IMAGE_ID}")"
          VERSION="$(sudo podman image inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "${IMAGE_ID}")"
          REVISION="$(sudo podman image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "${IMAGE_ID}")"
          BOOTC_LABEL="$(sudo podman image inspect --format '{{ index .Config.Labels "containers.bootc" }}' "${IMAGE_ID}")"
          RECHUNK_INFO="$(sudo podman image inspect --format '{{ index .Config.Labels "dev.hhd.rechunk.info" }}' "${IMAGE_ID}")"
          echo "Candidate image: ${LAYERS} layers"
          test "${LAYERS}" -le 128
          test "${VERSION}" = "${EXPECTED_VERSION}"
          test "${REVISION}" = "${EXPECTED_REVISION}"
          test "${BOOTC_LABEL}" = 1
          NORMALIZED_GROUPS="$(
            jq -r '.layers[][] | sub("^dedi:"; "") | sub("^meta:"; "")' \
              <<<"${RECHUNK_INFO}"
          )"
          for group in kyth-initramfs rpmdb kyth; do
            grep -Fxq "${group}" <<<"${NORMALIZED_GROUPS}" || {
              echo "Missing required rechunk group: ${group}" >&2
              exit 1
            }
          done
          sudo podman run --rm --entrypoint /usr/bin/bootc "${IMAGE_ID}" container lint

      - name: Remove temporary raw image tag
        if: always() && steps.build_final.outcome == 'success'
        env:
          RAW_REF: ${{ steps.build_final.outputs.raw_ref }}
        run: |
          skopeo delete \
            --authfile "${DOCKER_CONFIG}/config.json" \
            --retry-times 3 \
            "docker://${RAW_REF}" || echo "::warning::Could not remove temporary image ${RAW_REF}"

      - name: Publish and validate rechunked image
        id: publish_final
        env:
          IMAGE_FULL: ${{ steps.build_final.outputs.image }}
          SOURCE_REF: ${{ steps.rechunk.outputs.ref }}
          PRIMARY_TAG: ${{ steps.resolve_tag.outputs.tag }}
          TAGS: ${{ steps.metadata.outputs.tags }}
          EXPECTED_VERSION: ${{ steps.checkout_sha.outputs.image_version }}
          EXPECTED_REVISION: ${{ steps.checkout_sha.outputs.sha }}
        run: |
          exec 3>>"${GITHUB_OUTPUT}"
          set -euo pipefail
          PRIMARY_REF="${IMAGE_FULL}:${PRIMARY_TAG}"
          SKOPEO_COMPRESSION_ARGS=(
            --dest-compress-format zstd:chunked
            --dest-compress-level 3
          )
          export ZSTD_NBTHREADS="$(nproc)"
          SKOPEO_COPY_HELP="$(skopeo copy --help)"
          if [[ "${SKOPEO_COPY_HELP}" == *"--dest-force-compress-format"* ]]; then
            SKOPEO_COMPRESSION_ARGS+=(--dest-force-compress-format)
          else
            echo "::notice::Skopeo does not support --dest-force-compress-format; using compatible compression options"
          fi
          DIGEST_FILE="${RUNNER_TEMP}/rechunked-digest"
          PUBLISH_LOG="${RUNNER_TEMP}/skopeo-publish.log"
          publish_succeeded=false
          for attempt in 1 2 3 4 5; do
            install -m 0600 /dev/null "${DIGEST_FILE}"
            : >"${PUBLISH_LOG}"
            if sudo skopeo copy \
              --dest-authfile "${DOCKER_CONFIG}/config.json" \
              "${SKOPEO_COMPRESSION_ARGS[@]}" \
              --digestfile "${DIGEST_FILE}" \
              --retry-times 3 \
              "${SOURCE_REF}" \
              "docker://${PRIMARY_REF}" 2>&1 | tee "${PUBLISH_LOG}"; then
              publish_succeeded=true
              break
            else
              copy_status=${PIPESTATUS[0]}
            fi
            if ! grep -Fqi "secondary rate limit" "${PUBLISH_LOG}" || [[ "${attempt}" -eq 5 ]]; then
              exit "${copy_status}"
            fi
            delay=$((60 * (2 ** (attempt - 1))))
            echo "::warning::GHCR secondary rate limit; retrying resumable publish in ${delay}s (attempt ${attempt}/5)"
            sleep "${delay}"
          done
          [[ "${publish_succeeded}" == true ]]

          DIGEST="$(cat "${DIGEST_FILE}")"
          build_files/scripts/validate-digest.sh "${DIGEST}"
          for tag in ${TAGS}; do
            if [[ "${tag}" != "${PRIMARY_TAG}" ]]; then
              docker buildx imagetools create \
                --prefer-index=false \
                --tag "${IMAGE_FULL}:${tag}" \
                "${IMAGE_FULL}@${DIGEST}"
            fi
          done

          LAYERS="$(docker buildx imagetools inspect "${IMAGE_FULL}@${DIGEST}" --format '{{ len .Image.RootFS.DiffIDs }}')"
          LABELS_JSON="$(docker buildx imagetools inspect "${IMAGE_FULL}@${DIGEST}" --format '{{ json .Image.Config.Labels }}')"
          VERSION="$(jq -r '."org.opencontainers.image.version"' <<< "${LABELS_JSON}")"
          REVISION="$(jq -r '."org.opencontainers.image.revision"' <<< "${LABELS_JSON}")"
          BOOTC_LABEL="$(jq -r '."containers.bootc"' <<< "${LABELS_JSON}")"
          echo "Rechunked image: ${LAYERS} layers"
          test "${LAYERS}" -le 128
          test "${VERSION}" = "${EXPECTED_VERSION}"
          test "${REVISION}" = "${EXPECTED_REVISION}"
          test "${BOOTC_LABEL}" = 1

          echo "image=${IMAGE_FULL}" >&3
          echo "digest=${DIGEST}" >&3
          echo "version=${VERSION}" >&3
          echo "layers=${LAYERS}" >&3

      - name: Publish immutable build metadata
        env:
          IMAGE: ${{ steps.publish_final.outputs.image }}
          DIGEST: ${{ steps.publish_final.outputs.digest }}
          VERSION: ${{ steps.publish_final.outputs.version }}
          SOURCE_SHA: ${{ steps.checkout_sha.outputs.sha }}
          SOURCE_TAG: ${{ steps.resolve_tag.outputs.tag }}
          UPSTREAM_BASE: ${{ steps.upstream_base.outputs.pinned }}
          BUILD_BASE: ${{ steps.build_base.outputs.pinned }}
          PROTON_CACHYOS_VERSION: ${{ steps.proton_cachyos.outputs.version }}
          THIRDPARTY_VERSIONS_HASH: ${{ steps.thirdparty_versions.outputs.hash }}
          UMU_VERSION: ${{ steps.thirdparty_versions.outputs.version }}
          KERNEL_FLAVOR: ${{ matrix.kernel_flavor }}
          WORKFLOW_GITHUB_SHA: ${{ github.sha }}
        run: |
          python3 build_files/scripts/generate-metadata.py \
            --image "${IMAGE}" \
            --digest "${DIGEST}" \
            --version "${VERSION}" \
            --source-sha "${SOURCE_SHA}" \
            --github-sha "${WORKFLOW_GITHUB_SHA}" \
            --source-tag "${SOURCE_TAG}" \
            --run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --upstream-base "${UPSTREAM_BASE}" \
            --build-base "${BUILD_BASE}" \
            --proton-cachyos-version "${PROTON_CACHYOS_VERSION}" \
            --thirdparty-versions-hash "${THIRDPARTY_VERSIONS_HASH}" \
            --umu-version "${UMU_VERSION}" \
            --kernel-flavor "${KERNEL_FLAVOR}" \
            --output output/build-metadata/image.json

      - name: Upload immutable build metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-build-metadata-${{ steps.resolve_tag.outputs.tag }}
          path: output/build-metadata/image.json
          if-no-files-found: error
          retention-days: 7

  finalize:
    name: Attest and dispatch (${{ matrix.branch }}, ${{ matrix.kernel_flavor }})
    needs: [plan, build_push]
    if: ${{ always() && !cancelled() && needs.build_push.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJSON(needs.plan.outputs.branches) }}
        kernel_flavor: [fedora, cachy]
    permissions:
      actions: write
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      # This job previously needed no repo files (its one step was a pure
      # run: block), but a local composite action resolves from the checked-
      # out working tree, so Checkout is now required here too.
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ matrix.branch }}
          persist-credentials: false

      - name: Prepare artifact identity
        id: prep
        uses: ./.github/actions/resolve-image-tag
        with:
          branch: ${{ matrix.branch }}
          kernel-flavor: ${{ matrix.kernel_flavor }}

      - name: Download immutable build metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-build-metadata-${{ steps.prep.outputs.tag }}
          path: output/build-metadata

      - name: Read publication identity
        id: image
        env:
          EXPECTED_FLAVOR: ${{ matrix.kernel_flavor }}
        run: |
          exec 3>>"${GITHUB_OUTPUT}"
          METADATA=output/build-metadata/image.json
          jq -e . "${METADATA}" >/dev/null
          IMAGE="$(jq -r .image "${METADATA}")"
          DIGEST="$(jq -r .digest "${METADATA}")"
          SOURCE_SHA="$(jq -r .source_sha "${METADATA}")"
          GITHUB_SHA_META="$(jq -r '.github_sha // .source_sha' "${METADATA}")"
          KERNEL_FLAVOR="$(jq -r .materials.kernel_flavor "${METADATA}")"
          [[ "${IMAGE}" =~ ^ghcr\.io/[a-z0-9._/-]+$ ]]
          [[ "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${GITHUB_SHA_META}" =~ ^[0-9a-f]{40}$ ]]
          test "${KERNEL_FLAVOR}" = "${EXPECTED_FLAVOR}"
          echo "image=${IMAGE}" >&3
          echo "digest=${DIGEST}" >&3
          echo "source_sha=${SOURCE_SHA}" >&3
          echo "github_sha=${GITHUB_SHA_META}" >&3

      - name: Login to GitHub Container Registry
        uses: ./.github/actions/registry-login
        with:
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest image build provenance
        uses: ./.github/actions/attest-artifact
        with:
          subject-name: ${{ steps.image.outputs.image }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: "true"

      # Supply-chain metadata (SBOM attach, image release, CVE scan dispatch)
      # runs only against the Fedora-flavor image and needs the immutable
      # digest, so it is dispatched explicitly instead of using a workflow_run
      # trigger — workflow_run events carry no inputs and cannot pin the digest.
      - name: Dispatch supply chain metadata
        if: matrix.kernel_flavor == 'fedora'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          MATRIX_BRANCH: ${{ matrix.branch }}
          SOURCE_TAG: ${{ steps.prep.outputs.tag }}
          SOURCE_DIGEST: ${{ steps.image.outputs.digest }}
          SOURCE_SHA: ${{ steps.image.outputs.source_sha }}
          SOURCE_GITHUB_SHA: ${{ steps.image.outputs.github_sha }}
          ORIGINAL_EVENT: ${{ github.event_name }}
          ORIGINAL_ACTOR: ${{ github.actor }}
        run: |
          gh workflow run supply-chain.yml \
            --ref "${MATRIX_BRANCH}" \
            --field "source_tag=${SOURCE_TAG}" \
            --field "source_digest=${SOURCE_DIGEST}" \
            --field "source_sha=${SOURCE_SHA}" \
            --field "source_github_sha=${SOURCE_GITHUB_SHA}" \
            --field "original_event=${ORIGINAL_EVENT}" \
            --field "original_actor=${ORIGINAL_ACTOR}"

      # Live ISO is dispatched explicitly with the pinned Fedora digest so it
      # runs automatically after the Fedora container build succeeds — independent
      # of the cachy flavor outcome (workflow_run overall success would otherwise
      # block ISO when cachy fails due to fail-fast: false + aggregate result).
      - name: Dispatch Live ISO
        if: matrix.kernel_flavor == 'fedora'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          MATRIX_BRANCH: ${{ matrix.branch }}
          SOURCE_TAG: ${{ steps.prep.outputs.tag }}
          SOURCE_DIGEST: ${{ steps.image.outputs.digest }}
          SOURCE_SHA: ${{ steps.image.outputs.source_sha }}
        run: |
          gh workflow run build-live-iso.yml \
            --ref "${MATRIX_BRANCH}" \
            --field "source_tag=${SOURCE_TAG}" \
            --field "source_digest=${SOURCE_DIGEST}" \
            --field "source_sha=${SOURCE_SHA}" \
            --field "run_acceptance=true"
