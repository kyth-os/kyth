name: KVM diagnostic (throwaway)
on:
  workflow_dispatch: {}
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Before udev fix
        run: ls -la /dev/kvm || echo "NO_DEVICE_NODE"
      - name: Apply udev fix
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: After udev fix
        run: ls -la /dev/kvm
      - name: Try to actually initialize KVM in qemu
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-x86 >/dev/null
          set +e
          qemu-system-x86_64 -accel kvm -m 128 -display none -serial none \
            -monitor none -nodefaults -no-user-config -machine q35 \
            -device virtio-rng-pci >/tmp/qemu.out 2>&1 &
          QPID=$!
          sleep 3
          if kill -0 "${QPID}" 2>/dev/null; then
            echo "RESULT: KVM accel initialized successfully (qemu still running after 3s)"
            kill "${QPID}"
          else
            echo "RESULT: qemu exited immediately -- KVM accel failed"
          fi
          cat /tmp/qemu.out
