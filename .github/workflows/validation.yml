name: Validation

on:
  pull_request:
    branches:
      - main
      - testing
  push:
    branches:
      - main
      - testing
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ACTIONLINT_VERSION: 1.7.7
  HADOLINT_VERSION: 2.14.0
  JUST_VERSION: 1.52.0
  ZIZMOR_VERSION: 1.25.2
  ZIZMOR_SHA256: aa1facd105f0d83fe5c55b1adcd9d7417de5d83aa27471f91dc0b66cf3803577

jobs:
  validation:
    name: validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Cache validation tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/kyth-ci-tools
          key: validation-tools-${{ runner.os }}-${{ env.ACTIONLINT_VERSION }}-${{ env.HADOLINT_VERSION }}-${{ env.JUST_VERSION }}-${{ env.ZIZMOR_VERSION }}

      - name: Install pinned validators
        run: ./build_files/scripts/install-validation-tools.sh

      - name: Run repository validation suite
        run: ./build_files/scripts/validate.sh
