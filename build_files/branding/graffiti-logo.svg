<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 280" width="420" height="280" role="img" aria-label="Graffiti OS logo">
  <defs>
    <linearGradient id="g-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e62020"/>
      <stop offset="100%" stop-color="#990000"/>
    </linearGradient>
    <linearGradient id="r-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3d8bff"/>
      <stop offset="100%" stop-color="#1a4c99"/>
    </linearGradient>
    <linearGradient id="a-yellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </linearGradient>
    <linearGradient id="f-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2ed62e"/>
      <stop offset="100%" stop-color="#147014"/>
    </linearGradient>
    <linearGradient id="f-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b84cff"/>
      <stop offset="100%" stop-color="#6b1a99"/>
    </linearGradient>
    <linearGradient id="o-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3d8bff"/>
      <stop offset="100%" stop-color="#1a4c99"/>
    </linearGradient>
    <linearGradient id="s-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b84cff"/>
      <stop offset="100%" stop-color="#6b1a99"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </linearGradient>
    <radialGradient id="bg-glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#050505"/>
    </radialGradient>

    <filter id="outline" x="-20%" y="-20%" width="140%" height="140%">
      <feMorphology operator="dilate" radius="1.2" in="SourceAlpha" result="expand"/>
      <feFlood flood-color="#ffffff" flood-opacity="1" result="color"/>
      <feComposite in="color" in2="expand" operator="in" result="outline"/>
      <feMerge>
        <feMergeNode in="outline"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="outline-thin" x="-20%" y="-20%" width="140%" height="140%">
      <feMorphology operator="dilate" radius="0.8" in="SourceAlpha" result="expand"/>
      <feFlood flood-color="#ffffff" flood-opacity="1" result="color"/>
      <feComposite in="color" in2="expand" operator="in" result="outline"/>
      <feMerge>
        <feMergeNode in="outline"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="420" height="280" fill="url(#bg-glow)"/>

  <!-- Halo layers -->
  <ellipse cx="210" cy="110" rx="200" ry="80" fill="#ffd700" opacity="0.03"/>
  <ellipse cx="210" cy="110" rx="160" ry="60" fill="#e62020" opacity="0.02"/>

  <!-- ============ GRAFFITI ============ -->
  <!-- y=50 -->

  <!-- G (red) — x=96 -->
  <g transform="translate(96,50)">
    <g transform="translate(2,2)" opacity="0.85">
      <polygon points="0,0 10,0 12,44 0,40"/>
      <rect x="0" y="0" width="30" height="14"/>
      <rect x="10" y="14" width="14" height="14"/>
      <rect x="16" y="0" width="14" height="28"/>
      <polygon points="0,30 30,30 30,44 18,44 14,48 10,44"/>
    </g>
    <g filter="url(#outline)">
      <polygon points="0,0 10,0 12,44 0,40" fill="url(#g-red)"/>
      <rect x="0" y="0" width="30" height="14" fill="url(#g-red)"/>
      <rect x="10" y="14" width="14" height="14" fill="url(#g-red)"/>
      <rect x="16" y="0" width="14" height="28" fill="url(#g-red)"/>
      <polygon points="0,30 30,30 30,44 18,44 14,48 10,44" fill="url(#g-red)"/>
    </g>
  </g>

  <!-- R (blue) — x=130 -->
  <g transform="translate(130,50)">
    <g transform="translate(2,2)" opacity="0.85">
      <polygon points="0,0 10,0 12,44 0,40"/>
      <rect x="0" y="0" width="30" height="24"/>
      <polygon points="10,24 30,24 30,44 22,44 10,30"/>
    </g>
    <g filter="url(#outline)">
      <polygon points="0,0 10,0 12,44 0,40" fill="url(#r-blue)"/>
      <rect x="0" y="0" width="30" height="24" fill="url(#r-blue)"/>
      <polygon points="10,24 30,24 30,44 22,44 10,30" fill="url(#r-blue)"/>
    </g>
  </g>

  <!-- A (yellow) — x=164 -->
  <g transform="translate(164,50)">
    <g transform="translate(2,2)" opacity="0.85">
      <polygon points="15,0 30,44 20,44"/>
      <polygon points="15,0 10,44 0,44"/>
      <rect x="11" y="22" width="8" height="6"/>
    </g>
    <g filter="url(#outline)">
      <polygon points="15,0 30,44 20,44" fill="url(#a-yellow)"/>
      <polygon points="15,0 10,44 0,44" fill="url(#a-yellow)"/>
      <rect x="11" y="22" width="8" height="6" fill="url(#a-yellow)"/>
    </g>
  </g>

  <!-- F (green) — x=198 -->
  <g transform="translate(198,50)">
    <g transform="translate(2,2)" opacity="0.85">
      <rect x="0" y="0" width="10" height="44"/>
      <rect x="0" y="0" width="30" height="12"/>
      <rect x="0" y="18" width="26" height="10"/>
    </g>
    <g filter="url(#outline)">
      <rect x="0" y="0" width="10" height="44" fill="url(#f-green)"/>
      <rect x="0" y="0" width="30" height="12" fill="url(#f-green)"/>
      <rect x="0" y="18" width="26" height="10" fill="url(#f-green)"/>
    </g>
  </g>

  <!-- F (purple) — x=232 -->
  <g transform="translate(232,50)">
    <g transform="translate(2,2)" opacity="0.85">
      <rect x="0" y="0" width="10" height="44"/>
      <rect x="0" y="0" width="30" height="12"/>
      <rect x="0" y="18" width="26" height="10"/>
    </g>
    <g filter="url(#outline)">
      <rect x="0" y="0" width="10" height="44" fill="url(#f-purple)"/>
      <rect x="0" y="0" width="30" height="12" fill="url(#f-purple)"/>
      <rect x="0" y="18" width="26" height="10" fill="url(#f-purple)"/>
    </g>
  </g>

  <!-- I (red) — x=266 -->
  <g transform="translate(266,50)">
    <g transform="translate(2,2)" opacity="0.85">
      <rect x="0" y="0" width="10" height="44"/>
    </g>
    <g filter="url(#outline)">
      <rect x="0" y="0" width="10" height="44" fill="url(#g-red)"/>
    </g>
    <g filter="url(#outline-thin)">
      <path d="M 4,0 Q 4,-6 2,-8 Q 0,-6 0,0 Z" fill="url(#g-red)"/>
    </g>
  </g>

  <!-- T (blue) — x=280 -->
  <g transform="translate(280,50)">
    <g transform="translate(2,2)" opacity="0.85">
      <rect x="0" y="0" width="30" height="12"/>
      <rect x="10" y="0" width="10" height="44"/>
    </g>
    <g filter="url(#outline)">
      <rect x="0" y="0" width="30" height="12" fill="url(#r-blue)"/>
      <rect x="10" y="0" width="10" height="44" fill="url(#r-blue)"/>
    </g>
  </g>

  <!-- I (yellow) — x=314 -->
  <g transform="translate(314,50)">
    <g transform="translate(2,2)" opacity="0.85">
      <rect x="0" y="0" width="10" height="44"/>
    </g>
    <g filter="url(#outline)">
      <rect x="0" y="0" width="10" height="44" fill="url(#a-yellow)"/>
    </g>
  </g>

  <!-- ============ OS ============ -->

  <!-- O (blue) — x=190 -->
  <g transform="translate(190,102)">
    <g transform="translate(2,2)" opacity="0.85">
      <rect x="0" y="0" width="32" height="6"/>
      <rect x="0" y="26" width="32" height="6"/>
      <rect x="0" y="0" width="6" height="32"/>
      <rect x="26" y="0" width="6" height="32"/>
    </g>
    <g filter="url(#outline)">
      <rect x="0" y="0" width="32" height="6" fill="url(#o-blue)"/>
      <rect x="0" y="26" width="32" height="6" fill="url(#o-blue)"/>
      <rect x="0" y="0" width="6" height="32" fill="url(#o-blue)"/>
      <rect x="26" y="0" width="6" height="32" fill="url(#o-blue)"/>
    </g>
  </g>

  <!-- S (purple) — x=230 -->
  <g transform="translate(230,102)">
    <g transform="translate(2,2)" opacity="0.85">
      <rect x="0" y="0" width="26" height="8"/>
      <rect x="18" y="8" width="8" height="8"/>
      <rect x="0" y="16" width="26" height="8"/>
      <rect x="0" y="24" width="8" height="8"/>
      <rect x="0" y="32" width="26" height="10"/>
    </g>
    <g filter="url(#outline)">
      <rect x="0" y="0" width="26" height="8" fill="url(#s-purple)"/>
      <rect x="18" y="8" width="8" height="8" fill="url(#s-purple)"/>
      <rect x="0" y="16" width="26" height="8" fill="url(#s-purple)"/>
      <rect x="0" y="24" width="8" height="8" fill="url(#s-purple)"/>
      <rect x="0" y="32" width="26" height="10" fill="url(#s-purple)"/>
    </g>
  </g>

  <!-- Connecting arrow -->
  <g filter="url(#outline-thin)">
    <polygon points="295,70 310,70 308,80 320,92 308,88 306,94 290,82" fill="url(#r-blue)"/>
  </g>

  <!-- Spiked crown -->
  <g transform="translate(90,28)">
    <g transform="translate(1,1)" opacity="0.85">
      <polygon points="6,0 10,-10 14,0 20,-12 26,0 32,-10 38,0 42,-8 46,4" fill="#1a1a1a"/>
    </g>
    <g filter="url(#outline-thin)">
      <polygon points="6,0 10,-10 14,0 20,-12 26,0 32,-10 38,0 42,-8 46,4" fill="url(#gold)"/>
    </g>
  </g>

  <!-- Blood drips -->
  <g filter="url(#outline-thin)">
    <path d="M 160,94 Q 160,100 158,102 Q 156,100 156,94 Z" fill="url(#g-red)"/>
    <path d="M 250,94 Q 250,98 248,100 Q 246,98 246,94 Z" fill="url(#f-green)"/>
    <path d="M 330,94 Q 330,104 328,108 Q 326,104 326,94 Z" fill="url(#f-purple)"/>
  </g>

  <!-- Decorative stars -->
  <g fill="#ffd700" opacity="0.4">
    <circle cx="82" cy="130" r="2"/>
    <circle cx="340" cy="80" r="1.5"/>
    <circle cx="360" cy="140" r="1.5"/>
    <circle cx="70" cy="80" r="1"/>
  </g>

  <!-- Slash marks -->
  <line x1="350" y1="50" x2="370" y2="60" stroke="#ffffff" stroke-width="1" opacity="0.15"/>
  <line x1="60" y1="60" x2="75" y2="70" stroke="#ffffff" stroke-width="0.8" opacity="0.12"/>

  <!-- Tagline -->
  <text x="210" y="230"
        font-family="'DejaVu Sans', 'Liberation Sans', sans-serif"
        font-size="11"
        font-weight="300"
        fill="#555555"
        text-anchor="middle"
        letter-spacing="3">something beautiful made out of nothing</text>
</svg>
