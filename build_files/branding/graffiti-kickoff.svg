<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Graffiti OS launcher icon">
  <defs>
    <linearGradient id="gore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e62020"/>
      <stop offset="50%" stop-color="#cc0000"/>
      <stop offset="100%" stop-color="#880000"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </linearGradient>
    <linearGradient id="blade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c0c0c0"/>
      <stop offset="100%" stop-color="#606060"/>
    </linearGradient>
    <filter id="outline-white" x="-20%" y="-20%" width="140%" height="140%">
      <feMorphology operator="dilate" radius="1.2" in="SourceAlpha" result="expand"/>
      <feFlood flood-color="#ffffff" flood-opacity="1" result="color"/>
      <feComposite in="color" in2="expand" operator="in" result="outline"/>
      <feMerge>
        <feMergeNode in="outline"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="outline-white-thin" x="-20%" y="-20%" width="140%" height="140%">
      <feMorphology operator="dilate" radius="0.8" in="SourceAlpha" result="expand"/>
      <feFlood flood-color="#ffffff" flood-opacity="1" result="color"/>
      <feComposite in="color" in2="expand" operator="in" result="outline"/>
      <feMerge>
        <feMergeNode in="outline"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark badge background -->
  <rect width="64" height="64" rx="6" fill="#080808"/>

  <!-- Shadow G -->
  <g transform="translate(3,3)" opacity="0.9">
    <polygon points="6,6 20,6 22,58 6,54"/>
    <polygon points="6,6 56,6 56,18 20,18"/>
    <polygon points="20,18 34,18 34,30 20,30"/>
    <rect x="34" y="6" width="22" height="24"/>
    <polygon points="6,44 56,44 56,58 24,58 18,62 12,58"/>
  </g>

  <!-- G — assembled from sharp shards -->
  <g filter="url(#outline-white)">
    <!-- Left bar (sharp diagonal base) -->
    <polygon points="6,6 20,6 22,58 6,54" fill="url(#gore)"/>
    <!-- Top bar (blade edge) -->
    <polygon points="6,6 56,6 56,18 20,18" fill="url(#gore)"/>
    <!-- Crossbar -->
    <polygon points="20,18 34,18 34,30 20,30" fill="url(#gore)"/>
    <!-- Right upper block -->
    <rect x="34" y="6" width="22" height="24" fill="url(#gore)"/>
    <!-- Bottom bar with V-spike -->
    <polygon points="6,44 56,44 56,58 24,58 18,62 12,58" fill="url(#gore)"/>
  </g>

  <!-- Blood drips -->
  <g filter="url(#outline-white-thin)">
    <path d="M 16,6 Q 16,0 14,-2 Q 12,0 12,6 Z" fill="url(#gore)"/>
    <path d="M 44,30 Q 44,36 42,38 Q 40,36 40,30 Z" fill="url(#gore)"/>
  </g>

  <!-- Slash marks (scratches) -->
  <line x1="54" y1="12" x2="62" y2="20" stroke="#ffffff" stroke-width="0.8" opacity="0.5" stroke-linecap="round"/>
  <line x1="52" y1="34" x2="60" y2="42" stroke="#ffffff" stroke-width="0.6" opacity="0.35" stroke-linecap="round"/>
  <line x1="2" y1="30" x2="6" y2="38" stroke="#ffffff" stroke-width="0.6" opacity="0.3" stroke-linecap="round"/>

  <!-- Spiked crown -->
  <g filter="url(#outline-white-thin)">
    <polygon points="10,0 14,-10 18,0 24,-12 30,0 36,-10 42,0 46,-8 50,4" fill="url(#gold)"/>
  </g>

  <!-- Corona glow -->
  <ellipse cx="32" cy="32" rx="34" ry="34" fill="none" stroke="#e62020" stroke-width="0.5" opacity="0.3"/>
</svg>
