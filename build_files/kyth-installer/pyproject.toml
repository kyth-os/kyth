[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "kyth-installer"
version = "0.1.0"
description = "KythOS graphical installer"
requires-python = ">=3.11"
dependencies = ["kyth-shared>=0.1,<0.2"]

[project.scripts]
kyth-installer = "kyth_installer.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["kyth_installer*"]

[tool.setuptools.package-data]
kyth_installer = ["webui/*.css", "webui/*.html", "webui/*.js"]
