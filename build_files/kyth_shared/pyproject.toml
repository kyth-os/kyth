[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "kyth-shared"
version = "0.1.0"
description = "Shared pure-Python utilities for KythOS applications"
requires-python = ">=3.11"

[project.scripts]
kyth-ai-dev = "kyth_shared.ai_dev:main"
kyth-boot-health = "kyth_shared.boot_health:main"
kyth-qualify = "kyth_shared.qualification:main"
kyth-safe-upgrade = "kyth_shared.safe_upgrade:main"
kyth-smoke-check = "kyth_shared.smoke_check:main"
kyth-setup-transfer = "kyth_shared.setup_transfer:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["kyth_shared*"]
