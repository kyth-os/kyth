[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "kyth-shared"
version = "0.1.0"
description = "Shared pure-Python utilities for KythOS applications"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["kyth_shared*"]
