# Kyth tunable registry — source of truth for kyth-tunable dispatcher
# Each entry maps wrapper suffix (kyth-<name>) to its Python module.
# kind = "sysctl" means it emits /etc/sysctl.d/99-kyth-*.conf (migrates to sysctl_compose).
# kind = "other" means bespoke destination (kargs, toml, systemd, etc.).

[tunables."aio-max"]
module = "aio_max"
wrapper = "kyth-aio-max"
kind = "sysctl"

[tunables."ananicy"]
module = "ananicy_preset"
wrapper = "kyth-ananicy"
kind = "other"

