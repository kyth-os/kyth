# Every workaround must be device-scoped, explain why it exists, point to its
# provenance, and carry a review deadline. Expiration does not silently remove
# the workaround; CI fails so a maintainer must renew or delete it deliberately.
[[quirks]]
id = "amdgpu-gaming-memory"
reason = "Expose PowerPlay controls while bounding APU GTT pressure and retaining recoverable VM fault handling"
expires_on = "2027-08-01"
provenance = "[policy rationale](hardware-policy.md#managed-quirks)"

[[quirks.match.pci]]
vendor = "1002"
classes = ["0300", "0302", "0380"]
drivers = ["amdgpu"]

[[quirks.actions]]
kind = "modprobe"
module = "amdgpu"
options = { ppfeaturemask = "0xffffffff", gttsize = "4096", noretry = "0" }

[[quirks]]
id = "intel-i915-media-firmware"
reason = "Enable GuC submission and HuC media firmware on systems still using i915"
expires_on = "2027-08-01"
provenance = "[policy rationale](hardware-policy.md#managed-quirks)"

[[quirks.match.pci]]
vendor = "8086"
classes = ["0300", "0302", "0380"]
drivers = ["i915"]

[[quirks.actions]]
kind = "modprobe"
module = "i915"
options = { enable_guc = "3", enable_huc = "2" }

[[quirks]]
id = "nvidia-wayland-suspend"
reason = "Enable DRM modesetting and preserve video memory across suspend on the proprietary driver"
expires_on = "2027-08-01"
provenance = "[policy rationale](hardware-policy.md#managed-quirks)"

[[quirks.match.pci]]
vendor = "10de"
classes = ["0300", "0302", "0380"]

[[quirks.actions]]
kind = "modprobe"
module = "nvidia-drm"
options = { modeset = "1" }

[[quirks.actions]]
kind = "modprobe"
module = "nvidia"
options = { NVreg_PreserveVideoMemoryAllocations = "1", NVreg_TemporaryFilePath = "/var/tmp" }

[[quirks]]
id = "mediatek-pcie-wifi-aspm"
reason = "Avoid intermittent wake and association failures on mt7921e and mt7925e adapters"
expires_on = "2027-08-01"
provenance = "[policy rationale](hardware-policy.md#managed-quirks)"

[[quirks.match.pci]]
vendor = "14c3"
drivers = ["mt7921e", "mt7925e"]

[[quirks.actions]]
kind = "modprobe"
module = "mt7921e"
options = { disable_aspm = "1" }

[[quirks.actions]]
kind = "modprobe"
module = "mt7925e"
options = { disable_aspm = "1" }

[[quirks]]
id = "intel-wifi-association-power"
reason = "Keep Intel wireless active during WPA association while preserving Bluetooth coexistence"
expires_on = "2027-08-01"
provenance = "[policy rationale](hardware-policy.md#managed-quirks)"

[[quirks.match.pci]]
vendor = "8086"
drivers = ["iwlwifi"]

[[quirks.actions]]
kind = "modprobe"
module = "iwlwifi"
options = { power_save = "0", uapsd_disable = "3", bt_coex_active = "1" }

[[quirks.actions]]
kind = "modprobe"
module = "iwlmvm"
options = { power_scheme = "1" }

[[quirks]]
id = "bluetooth-usb-autosuspend"
reason = "Prevent missed remote wake traffic from Bluetooth controllers and low-bandwidth peripherals"
expires_on = "2027-08-01"
provenance = "[policy rationale](hardware-policy.md#managed-quirks)"

[[quirks.match.usb]]
drivers = ["btusb"]

[[quirks.actions]]
kind = "modprobe"
module = "btusb"
options = { enable_autosuspend = "0" }

[[quirks]]
id = "amdgpu-psr-disable"
reason = "Disable Display Core PSR on Navi 33 (7480) DCN 3.2.1 to avoid Pageflip timed out under Wayland/VRR"
expires_on = "2027-08-01"
provenance = "https://gitlab.freedesktop.org/drm/amd/-/issues and journalctl amdgpu Pageflip timed out (DCN 3.2.1)"

[[quirks.match.pci]]
vendor = "1002"
devices = ["7480"]
classes = ["0300", "0302", "0380"]
drivers = ["amdgpu"]

[[quirks.actions]]
kind = "modprobe"
module = "amdgpu"
options = { dcdebugmask = "0x10" }
