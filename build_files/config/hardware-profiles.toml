schema_version = 1
policy_revision = "2026.08.1"

# Variant records are intentionally honest about what is published today.
# Planned variants can be qualified without making them an updater target.
[[variants]]
id = "universal"
status = "shipping"
description = "AMD, Intel, NVIDIA and hybrid desktop/laptop systems"
qualification = "Automated image checks plus the current real-hardware matrix"

[[variants]]
id = "desktop-amd-intel"
status = "planned"
description = "AMD/Intel graphics without the proprietary NVIDIA payload"
qualification = "Requires representative AMD and Intel suspend, display and gaming results"

[[variants]]
id = "desktop-nvidia"
status = "planned"
description = "NVIDIA proprietary and hybrid graphics with prebuilt modules"
qualification = "Requires module ABI, Secure Boot, Wayland and suspend qualification"

[[variants]]
id = "handheld"
status = "planned"
description = "Controller-first handheld and couch-PC platforms"
qualification = "Requires per-device controls, suspend and dock validation"

