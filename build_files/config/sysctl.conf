# KythOS System Performance Tuning Parameters
# Unifies kernel parameters for gaming, container workloads, and high IOPS storage.

# Increase maximum memory map count for modern Windows/Proton games (e.g. Starfield, Hogwarts Legacy)
vm.max_map_count=2147483642

# Raise max open file descriptors for heavy parallel container operations
fs.file-max=2097152

# Enable TCP BBR congestion control for low-latency network performance
net.core.default_qdisc=fq
net.ipv4.tcp_congestion_control=bbr

# Adjust dirty memory ratio for smoother background storage flushing
vm.dirty_ratio=10
vm.dirty_background_ratio=5
