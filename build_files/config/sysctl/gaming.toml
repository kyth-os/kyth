# KythOS consolidated sysctl — tier: gaming (gated, only when gaming_master active)
# Source of truth for /etc/sysctl.d/99-kyth-gaming.conf
# Slice 3: 10 wrappers / 11 keys consolidated from per-tunable emitters (all non-duplicate vs base/network).
# Per-tunable shims remain until Slice 5 dispatcher removes 99-kyth-*.conf emitters.

# Keys prefixed with "-" are optional: sysctl.d ignores them silently when the
# running kernel lacks them (BORE is CachyOS-only; the CFS sched_* knobs were
# removed with EEVDF). Without the prefix each one logged a failure on
# every boot. vm.pressure_poll and kernel.khugepaged_defrag are not sysctls on
# any kernel and were removed; khugepaged defrag is set through sysfs in
# scripts/sysconfig/kernel/52-khugepaged-intervals.sh.

[keys."fs.aio-max-nr"]
value = "1048576"
comment = "aio-max gaming — consolidated from aio_max (was 99-kyth-aio-max.conf)"

[keys."-kernel.sched_bore"]
value = "1"
comment = "bore gaming — from bore_tune"

[keys."-kernel.sched_bore_burst_penalty_offset"]
value = "12"
comment = "bore gaming — from bore_tune"

[keys."net.core.busy_poll"]
value = "50"
comment = "busy-poll gaming — from busy_poll"

[keys."net.core.busy_read"]
value = "50"
comment = "busy-read gaming — from busy_read"

[keys."vm.min_free_kbytes"]
value = "131072"
comment = "min-free-kbytes gaming — from min_free_kbytes"

[keys."net.core.netdev_budget"]
value = "600"
comment = "netdev-budget gaming — from netdev_budget"

[keys."kernel.numa_balancing"]
value = "0"
comment = "numa-balancing gaming — from numa_balancing"

[keys."vm.overcommit_memory"]
value = "1"
comment = "overcommit-memory gaming — from overcommit_memory"

[keys."kernel.perf_cpu_time_max_percent"]
value = "5"
comment = "perf-cpu gaming — from perf_cpu"

[keys."net.core.rmem_default"]
value = "262144"
comment = "rmem-default gaming — from rmem_default"

# Slice 4: 13 wrappers / 12 keys (remaining non-duplicate sysctls). Total gaming 23 keys.
# Excludes 22 wrappers that duplicate base/network (see docs/tunables-inventory.md) — those become compat aliases via tunable registry.
# Note: vm.swappiness intentionally stays base-only (120 for productivity/APU); gaming_master may raise to 180 on 32GB+ via transient sysctl, not via tier duplicate.
# Note: the CFS scheduler-latency knobs (sched_latency_ns, sched_min_granularity_ns,
# sched_wakeup_granularity_ns, sched_migration_cost_ns, sched_nr_migrate,
# sched_child_runs_first) were removed from the kernel with EEVDF — the entries
# lived here -prefixed (silently ignored) and are now deleted outright. EEVDF
# has no equivalent tunables; scheduling latency is owned by scx/BORE paths.

[keys."net.core.somaxconn"]
value = "8192"
comment = "somaxconn gaming — from somaxconn"

[keys."net.ipv4.tcp_fin_timeout"]
value = "30"
comment = "tcp-fin-timeout gaming — from tcp_fin_timeout"

[keys."net.ipv4.tcp_keepalive_time"]
value = "120"
comment = "tcp-keepalive gaming — from tcp_keepalive"

[keys."net.ipv4.tcp_no_metrics_save"]
value = "1"
comment = "tcp-no-metrics-save gaming — from tcp_no_metrics_save"

[keys."net.ipv4.tcp_notsent_lowat"]
value = "16384"
comment = "tcp-notsent gaming — from tcp_notsent"

[keys."net.ipv4.tcp_orphan_retries"]
value = "0"
comment = "tcp-orphan-retries gaming — from tcp_orphan_retries"

[keys."net.ipv4.tcp_retries1"]
value = "3"
comment = "tcp-retries1 gaming — from tcp_retries1"

[keys."net.ipv4.tcp_retries2"]
value = "8"
comment = "tcp-retries2 gaming — from tcp_retries2"

[keys."net.ipv4.tcp_sack"]
value = "1"
comment = "tcp-sack gaming — from tcp_sack"

[keys."net.ipv4.tcp_timestamps"]
value = "1"
comment = "tcp-timestamps gaming — from tcp_timestamps"

[keys."net.ipv4.tcp_window_scaling"]
value = "1"
comment = "tcp-window-scaling gaming — from tcp_window_scaling"

[keys."net.core.wmem_default"]
value = "262144"
comment = "wmem-default gaming — from wmem_default"
