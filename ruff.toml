target-version = "py311"
line-length = 120

# Ruff's default discovery only matches *.py, so the extensionless executables
# in the extensionless update notifier were never linted — which is how it
# shipped a NameError (Path used with no import) that the selected F82 rules
# would have caught immediately. Listed individually on purpose:
# kyth-welcome-launch is a bash script and must stay out.
extend-include = [
    "build_files/kyth-welcome/kyth-update-notifier",
]

[lint]
# Correctness + blind-except (BLE001) — bare `except Exception:` now surfaces.
# Existing debt is grandfathered via per-file-ignores below; new code must
# name the exception or use `except Exception as exc:` with handling.
select = ["E9", "F63", "F7", "F82", "BLE001"]

[lint.per-file-ignores]
# Grandfathered until S10 cleanup — new files must not add bare broad-except.
"build_files/**/*.py" = ["BLE001"]
"tests/**/*.py" = ["BLE001"]
".github/scripts/**/*.py" = ["BLE001"]
# Same grandfathering as build_files/**/*.py — these are only listed separately
# because the glob above cannot match an extensionless filename.
"build_files/kyth-welcome/kyth-update-notifier" = ["BLE001"]
