# Kyth common systemd drop-in — shared resource/sandbox defaults for all kyth oneshot/long-running services
# Installed as /usr/lib/systemd/system/<unit>.d/override.conf via Dockerfile
# Keeps per-service files minimal (Description/ExecStart only); literal unit names preserved for greenboot/bootc
[Service]
TimeoutStartSec=90
TimeoutStopSec=30
MemoryHigh=384M
MemoryMax=512M
CPUQuota=50%
Nice=10
IOSchedulingClass=idle
NoNewPrivileges=yes
ProtectSystem=strict
PrivateTmp=yes
ProtectHome=read-only
ProtectClock=yes
ProtectKernelTunables=yes
ProtectControlGroups=yes
LockPersonality=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
