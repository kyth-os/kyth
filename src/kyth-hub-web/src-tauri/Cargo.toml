[package]
name = "kyth-hub-shell"
version = "0.1.0"
description = "Native shell for the Kyth Hub web frontend"
edition = "2021"
rust-version = "1.82" # matches ../../kyth-shared-rs's MSRV (Option::is_none_or)

[[bin]]
name = "kyth-hub-shell"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Rust port of kyth_shared (see that crate's MIGRATION.md) — the four
# bridge commands below call straight into it, no subprocess.
kyth-shared = { path = "../../kyth-shared-rs" }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
