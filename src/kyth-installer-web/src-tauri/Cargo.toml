[package]
name = "kyth-installer-shell"
version = "0.1.0"
description = "Unprivileged Tauri shell for the KythOS installer frontend"
edition = "2021"
rust-version = "1.82"

[[bin]]
name = "kyth-installer-shell"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
