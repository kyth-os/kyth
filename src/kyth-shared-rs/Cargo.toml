[package]
name = "kyth-shared"
version = "0.1.0"
edition = "2021"
rust-version = "1.82" # Option::is_none_or
description = "Rust port of src/kyth_shared — starts with the read-only modules the Kyth Hub shell needs; see MIGRATION.md for scope."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustix = { version = "0.38", features = ["fs", "process"] }

[dev-dependencies]
tempfile = "3"
