[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "kyth-hub-services"
version = "0.1.0"
description = "Transitional Kyth system-service helpers"
requires-python = ">=3.11"
dependencies = ["kyth-shared>=0.1,<0.2"]

[tool.setuptools.packages.find]
where = ["."]
include = ["kyth_welcome", "kyth_welcome.services*"]

[tool.setuptools.package-data]
kyth_welcome = ["*.json"]
